[package]
name = "sidelens-ui"
description = "SideLens 原生 UI 层：纯 Win32 控件 + DPI 感知 + 非阻塞消息泵"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]

[target.'cfg(windows)'.dependencies]
# 在 workspace 的 feature 集之上**额外**加这几个 Win32 feature：
#
# - Win32_UI_HiDpi：SetProcessDpiAwarenessContext / GetDpiForWindow /
#   AdjustWindowRectExForDpi。不加的话 200% 缩放下整个界面会小一半，
#   而且窗口外框会按 96 DPI 折算，边框被裁掉。
# - Win32_UI_Input_KeyboardAndMouse：EnableWindow / SetFocus。
#   set_enabled 的唯一正路，改 GWL_STYLE 的 WS_DISABLED 位不会重画，
#   控件会停在旧的视觉状态。
# - Win32_UI_Shell：SetWindowSubclass / DefSubclassProc（comctl32）。
#   用来给下拉框挂子类过程吞掉鼠标滚轮 —— 否则用户滚页面时手一滑就把
#   分辨率改掉了，这是 Win32 组合框的默认行为，没有样式位能关掉。
#
# 这些只在**本 crate** 加，不动 workspace 根 Cargo.toml —— 别的 crate
# 一个 HiDpi 符号都不用，加了只会拖慢它们的编译。
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
