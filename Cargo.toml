[workspace]
resolver = "2"
members = [
    "crates/sidelens-proto",
    "crates/sidelens-core",
    "crates/sidelens-transport",
    "apps/sidelensd",
    "apps/sidelenssend",
    "crates/sidelens-vcam",
    "crates/sidelens-vcam-dll",
    "crates/sidelens-codec",
    "crates/sidelens-ipc",
    "crates/sidelens-crypto",
    "crates/sidelens-codec-opus",
    "crates/sidelens-codec-mf",
    "crates/sidelens-render",
    "crates/sidelens-audio-out",
    "crates/sidelens-audio-in",
    "crates/sidelens-capture",
    "crates/sidelens-render-gpu",
    "crates/sidelens-ui",
    "crates/sidelens-dshow",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"

[workspace.dependencies]
sidelens-proto = { path = "crates/sidelens-proto" }
sidelens-core = { path = "crates/sidelens-core" }
sidelens-transport = { path = "crates/sidelens-transport" }
sidelens-vcam = { path = "crates/sidelens-vcam" }
sidelens-codec = { path = "crates/sidelens-codec" }
sidelens-ipc = { path = "crates/sidelens-ipc" }
sidelens-crypto = { path = "crates/sidelens-crypto" }
sidelens-codec-opus = { path = "crates/sidelens-codec-opus" }
sidelens-codec-mf = { path = "crates/sidelens-codec-mf" }
sidelens-render = { path = "crates/sidelens-render" }
sidelens-audio-out = { path = "crates/sidelens-audio-out" }
sidelens-audio-in = { path = "crates/sidelens-audio-in" }
sidelens-capture = { path = "crates/sidelens-capture" }
sidelens-render-gpu = { path = "crates/sidelens-render-gpu" }
sidelens-ui = { path = "crates/sidelens-ui" }
sidelens-dshow = { path = "crates/sidelens-dshow" }

serde = "1"
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
windows-core = "0.62"
# windows crate 的体积随 feature 数线性增长：本项目开 15 个 feature 时，
# release 的 libwindows.rlib 就有 105 MB、rmeta 100 MB，是全仓最大的单个产物。
#
# 裁剪原则：
#   1. 只留源码里真正 use 到的命名空间。Win32_System_SystemInformation 曾在此，
#      但全仓无一处引用（GetSystemInfo 系列没用过），已移除。
#   2. 不能按「源码没引用」删 Win32_Security —— CreateFileW / CreateNamedPipeW /
#      CreateEventW / CreateFileMappingW 都依赖它做前置，删了 sidelens-ipc 直接 E0432。
#   3. 加新 feature 前先 grep 确认用法，改完跑 cargo check --workspace --all-targets。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_Properties",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_DirectShow",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Media_KernelStreaming",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[profile.release]
lto = "thin"
codegen-units = 1